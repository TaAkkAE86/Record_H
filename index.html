<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>PulseQuest</title>
<meta name="theme-color" content="#0f0a2a" />
<meta name="description" content="Gamified blood pressure and heart rate tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PulseQuest" />

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
  :root { --spring: cubic-bezier(.34,1.56,.64,1); }
  html, body { margin:0; background:#0f0a2a; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    color:#f1f0ff; min-height:100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(139,92,246,.45), transparent 60%),
      radial-gradient(700px 500px at 100% 10%, rgba(6,214,230,.28), transparent 60%),
      radial-gradient(800px 600px at 50% 110%, rgba(236,72,153,.22), transparent 60%),
      #0f0a2a;
    background-attachment: fixed;
    -webkit-user-select:none; user-select:none;
  }
  input, textarea { -webkit-user-select:text; user-select:text; }
  .glass {
    background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.18);
    border-radius: 24px;
  }
  .btn {
    position:relative; overflow:hidden; cursor:pointer; border:0; outline:0;
    transition: transform .45s var(--spring), box-shadow .25s ease, filter .25s ease;
    touch-action: manipulation;
  }
  .btn:hover { filter:brightness(1.12); box-shadow:0 0 22px rgba(34,211,238,.55); }
  .btn:active { transform:scale(.92); transition: transform .08s ease; box-shadow:0 0 30px rgba(168,85,247,.8); }
  .ripple {
    position:absolute; border-radius:50%; background:rgba(255,255,255,.55);
    transform:scale(0); animation: ripple .65s ease-out forwards; pointer-events:none;
  }
  @keyframes ripple { to { transform:scale(4); opacity:0; } }
  .page-enter { animation: pageIn .45s var(--spring) both; }
  @keyframes pageIn { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:none; } }
  .pop { animation: pop .5s var(--spring) both; }
  @keyframes pop { from { opacity:0; transform:scale(.7) translateY(30px); } to { opacity:1; transform:none; } }
  .fade { animation: fade .25s ease both; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  .slide-in { animation: slideIn .4s var(--spring) both; }
  @keyframes slideIn { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:none; } }
  .cta-pulse { animation: ctaPulse 2.2s ease-in-out infinite; }
  @keyframes ctaPulse {
    0%,100% { box-shadow:0 0 0 0 rgba(34,211,238,.55), 0 0 40px rgba(168,85,247,.55); }
    50% { box-shadow:0 0 0 22px rgba(34,211,238,0), 0 0 60px rgba(34,211,238,.7); }
  }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
  .heartbeat { animation: hb 1.3s ease-in-out infinite; display:inline-block; }
  @keyframes hb { 0%,100% { transform:scale(1) } 15% { transform:scale(1.25) } 30% { transform:scale(1) } 45% { transform:scale(1.18) } }
  .exp-fill { transition: width 1s var(--spring); background-size:200% 100%; animation: shimmer 2.5s linear infinite; }
  @keyframes shimmer { from { background-position:200% 0 } to { background-position:-200% 0 } }
  .draw { stroke-dasharray:1; stroke-dashoffset:1; animation: draw 1.1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset:0 } }
  .field {
    width:100%; background:rgba(0,0,0,.28); border:1.5px solid rgba(255,255,255,.14);
    border-radius:18px; color:#fff; outline:none; transition: border-color .2s, box-shadow .2s, transform .3s var(--spring);
  }
  .field:focus { border-color:#22d3ee; box-shadow:0 0 0 4px rgba(34,211,238,.2), 0 0 20px rgba(34,211,238,.35); transform:scale(1.02); }
  .field::placeholder { color:rgba(255,255,255,.28); }
  .badge-locked { filter:grayscale(1); opacity:.35; }
  .hide-scroll::-webkit-scrollbar { display:none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div id="root"></div>
<noscript>PulseQuest needs JavaScript.</noscript>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================ CONSTANTS & HELPERS ============================ */
const KEY = "pulsequest-v1";
const DAY = 864e5;
const pad = (n) => String(n).padStart(2, "0");
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const fmtTime = (t) => new Date(t).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtShort = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const levelOf = (exp) => Math.floor(exp / 100) + 1;
const avg = (a) => a.reduce((s, x) => s + x, 0) / (a.length || 1);
const sd = (a) => { const m = avg(a); return Math.sqrt(avg(a.map((x) => (x - m) ** 2))); };

const CATS = {
  low: {
    key: "low", label: "Low", color: "#38bdf8", emoji: "💧",
    summary: "Your pressure is lower than the typical range.",
    tips: ["Drink water regularly and don't skip meals.", "Stand up slowly from sitting or lying down.", "Add a little more salt only if your doctor agrees.", "If you feel dizzy, faint or weak, sit down and contact a clinician."],
  },
  normal: {
    key: "normal", label: "Normal", color: "#34d399", emoji: "💚",
    summary: "Great job! Your reading is in the healthy range.",
    tips: ["Keep up 150 minutes of moderate activity each week.", "Eat plenty of fruit, vegetables and whole grains.", "Keep sodium low and sleep 7–9 hours.", "Keep logging at the same time each day for reliable trends."],
  },
  elevated: {
    key: "elevated", label: "Elevated", color: "#facc15", emoji: "⚠️",
    summary: "Slightly above ideal. Lifestyle changes can bring it back down.",
    tips: ["Cut back on salt and processed foods.", "Take a brisk 30-minute walk most days.", "Limit alcohol and caffeine, and try 5 minutes of slow breathing.", "Recheck in a few days and track the pattern."],
  },
  stage1: {
    key: "stage1", label: "Hypertension Stage 1", color: "#fb923c", emoji: "🟠",
    summary: "This is in the Stage 1 hypertension range.",
    tips: ["Talk to your healthcare provider, especially if this repeats.", "Follow a DASH-style diet: more potassium, less sodium.", "Aim for a healthy weight and regular exercise.", "Manage stress, quit smoking, and measure twice a day for a week."],
  },
  stage2: {
    key: "stage2", label: "Hypertension Stage 2", color: "#f43f5e", emoji: "🔴",
    summary: "This is in the Stage 2 hypertension range. Medical follow-up is recommended.",
    tips: ["Contact your doctor soon. Treatment often includes medication.", "Rest 5 minutes, then re-measure seated with your arm supported.", "Avoid salt, alcohol and tobacco.", "Bring your PulseQuest CSV export to your appointment."],
  },
  crisis: {
    key: "crisis", label: "Hypertensive Crisis", color: "#ef4444", emoji: "🚨",
    summary: "This reading is dangerously high.",
    tips: ["Rest and re-measure after 5 minutes.", "If it is still this high, contact your doctor right away.", "Chest pain, shortness of breath, numbness, vision or speech changes: call emergency services immediately."],
  },
};
function classify(s, d) {
  if (s > 180 || d > 120) return CATS.crisis;
  if (s >= 140 || d >= 90) return CATS.stage2;
  if (s >= 130 || d >= 80) return CATS.stage1;
  if (s < 90 || d < 60) return CATS.low;
  if (s >= 120) return CATS.elevated;
  return CATS.normal;
}
function hrStatus(h) {
  if (h < 60) return { label: "Low", color: "#38bdf8" };
  if (h <= 100) return { label: "Normal", color: "#34d399" };
  return { label: "High", color: "#f43f5e" };
}
// traffic-light colour for the main indicator (green / yellow / red)
const trafficColor = (c) => ({ normal: "#34d399", low: "#38bdf8", elevated: "#facc15", stage1: "#fb923c" }[c.key] || "#f43f5e");

const BADGES = [
  { id: "first", icon: "🩺", name: "First Pulse", desc: "Log your first reading", test: (s) => s.logs.length >= 1 },
  { id: "s3", icon: "🔥", name: "On Fire", desc: "3-day streak", test: (s) => s.streak >= 3 },
  { id: "s7", icon: "⚡", name: "Week Warrior", desc: "7-day streak", test: (s) => s.streak >= 7 },
  { id: "l10", icon: "📈", name: "Data Hero", desc: "Log 10 readings", test: (s) => s.logs.length >= 10 },
  { id: "g5", icon: "💚", name: "Green Zone", desc: "5 normal readings", test: (s) => s.logs.filter((l) => classify(l.sys, l.dia).key === "normal").length >= 5 },
  { id: "tag", icon: "🏷️", name: "Tag Master", desc: "Use 3 different tags", test: (s) => new Set(s.logs.map((l) => l.tag).filter(Boolean)).size >= 3 },
  { id: "lv3", icon: "🏆", name: "Level 3", desc: "Reach level 3", test: (s) => levelOf(s.exp) >= 3 },
];
const earnedIds = (s) => BADGES.filter((b) => b.test(s)).map((b) => b.id);

function seed() {
  const now = new Date();
  const mk = (d, h, m, sys, dia, hr, tag, i) => {
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate() - d, h, m).getTime();
    return { id: "seed" + i, ts: t, sys, dia, hr, tag };
  };
  const logs = [
    mk(6, 8, 10, 128, 82, 74, "Morning", 1),
    mk(5, 21, 30, 134, 86, 78, "Before Bed", 2),
    mk(4, 7, 45, 122, 78, 70, "Morning", 3),
    mk(3, 8, 20, 118, 76, 68, "Morning", 4),
    mk(2, 19, 0, 142, 91, 96, "After Exercise", 5),
    mk(1, 7, 50, 119, 77, 69, "Morning", 6),
    mk(1, 21, 15, 124, 80, 72, "Before Bed", 7),
  ];
  return { logs, exp: 175, streak: 6, lastDay: dayKey(Date.now() - DAY) };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.logs)) return s; } } catch (e) {}
  return seed();
}
function effStreak(s) {
  const t = dayKey(Date.now()), y = dayKey(Date.now() - DAY);
  return s.lastDay === t || s.lastDay === y ? s.streak : 0;
}

function buildCSV(logs) {
  const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [["Date", "Time", "Systolic (mmHg)", "Diastolic (mmHg)", "Pulse (bpm)", "Category", "Notes/Tag"]];
  [...logs].sort((a, b) => b.ts - a.ts).forEach((l) => {
    const d = new Date(l.ts);
    rows.push([dayKey(l.ts), pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()), l.sys, l.dia, l.hr, classify(l.sys, l.dia).label, l.tag || ""]);
  });
  return "\uFEFF" + rows.map((r) => r.map(q).join(",")).join("\r\n");
}
async function exportCSV(logs) {
  const name = "pulsequest-" + dayKey(Date.now()) + ".csv";
  const blob = new Blob([buildCSV(logs)], { type: "text/csv;charset=utf-8;" });
  try {
    const file = new File([blob], name, { type: "text/csv" });
    // iOS standalone apps cannot always download blobs, so use the share sheet there
    if (/iPad|iPhone|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "PulseQuest export" });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function getInsights(logs) {
  const out = [];
  if (logs.length < 3) return [{ icon: "🧪", text: "Log at least 3 readings in this range to unlock Smart Insights." }];
  const sys = logs.map((l) => l.sys), hr = logs.map((l) => l.hr);
  const s = sd(sys);
  out.push(s < 6 ? { icon: "🎯", text: "Your systolic pressure is very consistent (±" + s.toFixed(1) + " mmHg). Nice stability!" }
    : s < 12 ? { icon: "📊", text: "Your systolic pressure varies moderately (±" + s.toFixed(1) + " mmHg)." }
    : { icon: "🎢", text: "Your systolic pressure swings a lot (±" + s.toFixed(1) + " mmHg). Try measuring under the same conditions each time." });
  const am = logs.filter((l) => new Date(l.ts).getHours() < 12), pm = logs.filter((l) => new Date(l.ts).getHours() >= 17);
  if (am.length && pm.length) {
    const diff = avg(pm.map((l) => l.sys)) - avg(am.map((l) => l.sys));
    if (Math.abs(diff) >= 5) out.push({ icon: diff > 0 ? "🌙" : "🌅", text: "Your systolic pressure runs about " + Math.abs(diff).toFixed(0) + " mmHg " + (diff > 0 ? "higher in the evening" : "higher in the morning") + "." });
    else out.push({ icon: "⏱️", text: "No big time-of-day difference. Morning and evening readings are similar." });
  }
  const hs = sd(hr), ha = avg(hr);
  out.push({ icon: "💓", text: "Average pulse " + ha.toFixed(0) + " bpm, " + (hs < 6 ? "very stable" : hs < 12 ? "fairly stable" : "quite variable") + " (±" + hs.toFixed(1) + ")." + (ha > 100 ? " That is above the typical resting range." : ha < 60 ? " That is below the typical resting range." : "") });
  const spike = logs.filter((l) => l.hr > 100 || l.sys >= 140);
  if (spike.length) {
    const t = spike[spike.length - 1];
    out.push({ icon: "📍", text: spike.length + " reading(s) were high. Most recent: " + fmtShort(t.ts) + (t.tag ? " (" + t.tag + ")" : "") + "." });
  }
  if (logs.length >= 4) {
    const h = Math.floor(logs.length / 2);
    const d = avg(sys.slice(h)) - avg(sys.slice(0, h));
    if (Math.abs(d) >= 4) out.push({ icon: d < 0 ? "📉" : "📈", text: "Recent systolic readings are trending " + (d < 0 ? "down" : "up") + " by about " + Math.abs(d).toFixed(0) + " mmHg." });
  }
  const pct = Math.round(logs.filter((l) => classify(l.sys, l.dia).key === "normal").length / logs.length * 100);
  out.push({ icon: pct >= 60 ? "✅" : "🩹", text: pct + "% of your readings are in the normal range." });
  return out;
}

/* ============================ UI PRIMITIVES ============================ */
function Btn({ children, className = "", onClick, style, type = "button", disabled }) {
  const [ripples, setRipples] = useState([]);
  const down = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    setRipples((p) => [...p, { id: Math.random(), x: e.clientX - r.left - size / 2, y: e.clientY - r.top - size / 2, size }]);
    if (navigator.vibrate) navigator.vibrate(8);
  };
  return (
    <button type={type} disabled={disabled} onPointerDown={down} onClick={onClick} style={style} className={"btn " + className}>
      {children}
      {ripples.map((r) => (
        <span key={r.id} className="ripple" style={{ left: r.x, top: r.y, width: r.size, height: r.size }}
          onAnimationEnd={() => setRipples((p) => p.filter((x) => x.id !== r.id))} />
      ))}
    </button>
  );
}

function Confetti({ trigger }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!trigger) return;
    const c = ref.current; const ctx = c.getContext("2d");
    c.width = innerWidth; c.height = innerHeight;
    const colors = ["#22d3ee", "#a855f7", "#f472b6", "#facc15", "#34d399", "#fff"];
    const ps = Array.from({ length: 140 }, () => {
      const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 12;
      return { x: c.width / 2, y: c.height * 0.55, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 7, g: .3 + Math.random() * .2,
        s: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: colors[(Math.random() * colors.length) | 0], star: Math.random() > .6 };
    });
    let f = 0, raf;
    const tick = () => {
      ctx.clearRect(0, 0, c.width, c.height); f++;
      ps.forEach((p) => {
        p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.globalAlpha = Math.max(0, 1 - f / 110); ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 12;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        if (p.star) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      });
      if (f < 110) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, [trigger]);
  return <canvas ref={ref} className="fixed inset-0 pointer-events-none" style={{ zIndex: 80 }} />;
}

const Icon = ({ name, className = "w-6 h-6" }) => {
  const p = { fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  const paths = {
    home: <><path d="M3 11l9-8 9 8" /><path d="M5 10v10h14V10" /></>,
    plus: <><path d="M12 5v14M5 12h14" /></>,
    chart: <><path d="M3 3v18h18" /><path d="M7 15l4-5 3 3 5-7" /></>,
    list: <><path d="M8 6h13M8 12h13M8 18h13" /><circle cx="3.5" cy="6" r=".8" /><circle cx="3.5" cy="12" r=".8" /><circle cx="3.5" cy="18" r=".8" /></>,
    trash: <><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" /></>,
    dl: <><path d="M12 3v12M7 10l5 5 5-5M4 21h16" /></>,
  };
  return <svg viewBox="0 0 24 24" className={className} {...p}>{paths[name]}</svg>;
};

/* ============================ HOME ============================ */
function Home({ state, go, installEvt, onInstall }) {
  const { logs, exp } = state;
  const lvl = levelOf(exp), inLvl = exp % 100;
  const streak = effStreak(state);
  const earned = earnedIds(state);
  const latest = [...logs].sort((a, b) => b.ts - a.ts)[0];
  const cat = latest && classify(latest.sys, latest.dia);
  const hs = latest && hrStatus(latest.hr);
  const [w, setW] = useState(0);
  useEffect(() => { const t = setTimeout(() => setW(inLvl), 150); return () => clearTimeout(t); }, [inLvl]);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  return (
    <div className="space-y-4">
      <header className="flex items-center justify-between pt-2">
        <div>
          <p className="text-xs uppercase tracking-widest text-cyan-300/80">Health RPG</p>
          <h1 className="text-2xl font-extrabold">Pulse<span className="text-cyan-300">Quest</span></h1>
        </div>
        <span className="heartbeat text-3xl">❤️</span>
      </header>

      <section className="glass p-5">
        <div className="flex items-center gap-4">
          <div className="relative w-20 h-20 shrink-0 rounded-full flex items-center justify-center float"
            style={{ background: "conic-gradient(#22d3ee " + inLvl * 3.6 + "deg, rgba(255,255,255,.1) 0)", boxShadow: "0 0 26px rgba(34,211,238,.5)" }}>
            <div className="w-[68px] h-[68px] rounded-full flex flex-col items-center justify-center" style={{ background: "#1a1245" }}>
              <span className="text-[10px] text-cyan-300 font-bold tracking-widest">LEVEL</span>
              <span className="text-3xl font-black leading-none">{lvl}</span>
            </div>
          </div>
          <div className="flex-1 min-w-0">
            <div className="flex justify-between text-xs font-semibold mb-1">
              <span>EXP</span><span className="text-cyan-300">{inLvl} / 100</span>
            </div>
            <div className="h-3.5 rounded-full bg-black/40 overflow-hidden">
              <div className="exp-fill h-full rounded-full" style={{ width: w + "%", backgroundImage: "linear-gradient(90deg,#a855f7,#22d3ee,#34d399,#a855f7)", boxShadow: "0 0 14px #22d3ee" }} />
            </div>
            <p className="text-[11px] text-white/50 mt-1">{100 - inLvl} EXP to Level {lvl + 1}</p>
            <div className="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-bold" style={{ background: "rgba(251,146,60,.18)", color: "#fdba74" }}>
              <span className={streak ? "heartbeat" : ""}>🔥</span> {streak}-day streak
            </div>
          </div>
        </div>
        <div className="mt-4">
          <p className="text-xs uppercase tracking-widest text-white/50 mb-2">Badges · {earned.length}/{BADGES.length}</p>
          <div className="grid grid-cols-7 gap-1.5">
            {BADGES.map((b, i) => (
              <div key={b.id} title={b.name + ": " + b.desc} className={"slide-in aspect-square rounded-xl flex items-center justify-center text-xl " + (earned.includes(b.id) ? "" : "badge-locked")}
                style={{ animationDelay: i * 60 + "ms", background: earned.includes(b.id) ? "linear-gradient(145deg,rgba(168,85,247,.5),rgba(34,211,238,.4))" : "rgba(255,255,255,.08)", boxShadow: earned.includes(b.id) ? "0 0 14px rgba(34,211,238,.45)" : "none" }}>
                {b.icon}
              </div>
            ))}
          </div>

/* ============================ RECORD ============================ */
const TAGS = ["Morning", "After Exercise", "Before Bed", "After Meal", "Stressed", "Resting"];
function Record({ onSave }) {
  const [sys, setSys] = useState(""); const [dia, setDia] = useState(""); const [hr, setHr] = useState("");
  const [tag, setTag] = useState(""); const [err, setErr] = useState("");
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const clean = (fn) => (e) => { fn(e.target.value.replace(/\D/g, "").slice(0, 3)); setErr(""); };

  const submit = (e) => {
    e.preventDefault();
    const s = +sys, d = +dia, h = +hr;
    if (!sys || !dia || !hr) return setErr("Please fill in SYS, DIA and Pulse.");
    if (s < 50 || s > 260) return setErr("Systolic should be between 50 and 260 mmHg.");
    if (d < 30 || d > 160) return setErr("Diastolic should be between 30 and 160 mmHg.");
    if (h < 30 || h > 220) return setErr("Pulse should be between 30 and 220 bpm.");
    if (d >= s) return setErr("Systolic must be higher than diastolic.");
    onSave({ sys: s, dia: d, hr: h, tag: tag.trim() });
    setSys(""); setDia(""); setHr(""); setTag("");
  };

  const num = ({ label, unit, value, set, color, ph, id }) => (
    <label htmlFor={id} className="block">
      <div className="flex justify-between text-xs font-bold mb-1.5"><span style={{ color }}>{label}</span><span className="text-white/40">{unit}</span></div>
      <input id={id} className="field text-center text-4xl font-black py-4" type="text" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next"
        autoComplete="off" placeholder={ph} value={value} onChange={clean(set)} />
    </label>
  );

  return (
    <form onSubmit={submit} className="space-y-4">
      <header className="pt-2">
        <h1 className="text-2xl font-extrabold">New <span className="text-cyan-300">Reading</span></h1>
        <p className="text-xs text-white/50 mt-1">🕒 {fmtDate(now)} · {fmtTime(now)}</p>
      </header>
      <section className="glass p-5 space-y-4">
        {num({ id: "sys", label: "SYSTOLIC (SYS)", unit: "mmHg", value: sys, set: setSys, color: "#ff7aa2", ph: "120" })}
        {num({ id: "dia", label: "DIASTOLIC (DIA)", unit: "mmHg", value: dia, set: setDia, color: "#22d3ee", ph: "80" })}
        {num({ id: "hr", label: "HEART RATE (PULSE)", unit: "bpm", value: hr, set: setHr, color: "#a3e635", ph: "72" })}
      </section>
      <section className="glass p-5">
        <p className="text-xs font-bold text-white/60 mb-2">NOTES / TAG <span className="text-white/30">(optional, +5 EXP)</span></p>
        <div className="flex flex-wrap gap-2 mb-3">
          {TAGS.map((t) => (
            <Btn key={t} onClick={() => setTag(tag === t ? "" : t)} className="px-3 py-1.5 rounded-full text-xs font-bold"
              style={{ background: tag === t ? "linear-gradient(90deg,#7c3aed,#06b6d4)" : "rgba(255,255,255,.1)", color: "#fff" }}>{t}</Btn>
          ))}
        </div>
        <input className="field px-4 py-3 text-sm" placeholder="Or type a custom note…" maxLength={40} value={tag} onChange={(e) => setTag(e.target.value)} />
      </section>
      {err && <p className="pop text-sm text-rose-300 text-center font-semibold" role="alert">{err}</p>}
      <Btn type="submit" className="w-full py-4 rounded-2xl text-lg font-black text-white" style={{ background: "linear-gradient(90deg,#7c3aed,#06b6d4,#10b981)", boxShadow: "0 8px 28px rgba(6,182,212,.45)" }}>
        💾 Save Reading
      </Btn>
      <p className="text-[11px] text-center text-white/40">The date and time are captured automatically when you save.</p>
    </form>
  );
}

/* ============================ TRENDS ============================ */
const SERIES = [
  { k: "sys", label: "SYS", color: "#ff7aa2" },
  { k: "dia", label: "DIA", color: "#22d3ee" },
  { k: "hr", label: "Pulse", color: "#a3e635" },
];
function Trends({ logs }) {
  const [range, setRange] = useState("7");
  const [on, setOn] = useState({ sys: true, dia: true, hr: true });
  const [sel, setSel] = useState(null);

  const data = useMemo(() => {
    const sorted = [...logs].sort((a, b) => a.ts - b.ts);
    if (range === "all") return sorted;
    const cut = Date.now() - +range * DAY;
    return sorted.filter((l) => l.ts >= cut);
  }, [logs, range]);
  useEffect(() => setSel(null), [range]);

  const W = 340, H = 200, L = 30, R = 10, T = 12, B = 24;
  const active = SERIES.filter((s) => on[s.k]);
  const vals = data.flatMap((l) => active.map((s) => l[s.k]));
  const min = vals.length ? Math.floor((Math.min(...vals) - 8) / 10) * 10 : 0;
  const max = vals.length ? Math.ceil((Math.max(...vals) + 8) / 10) * 10 : 100;
  const t0 = data.length ? data[0].ts : 0, t1 = data.length ? data[data.length - 1].ts : 1;
  const X = (l) => L + (data.length < 2 || t1 === t0 ? (W - L - R) / 2 : ((l.ts - t0) / (t1 - t0)) * (W - L - R));
  const Y = (v) => T + (1 - (v - min) / (max - min || 1)) * (H - T - B);

  const move = (e) => {
    if (!data.length) return;
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    let best = 0, bd = 1e9;
    data.forEach((l, i) => { const d = Math.abs(X(l) - x); if (d < bd) { bd = d; best = i; } });
    setSel(best);
  };
  const point = sel != null ? data[sel] : null;

  const stat = (k) => { const a = data.map((l) => l[k]); return a.length ? { avg: Math.round(avg(a)), max: Math.max(...a), min: Math.min(...a) } : null; };
  const insights = useMemo(() => getInsights(data), [data]);

  return (
    <div className="space-y-4">
      <header className="pt-2"><h1 className="text-2xl font-extrabold">Trends & <span className="text-cyan-300">Analytics</span></h1></header>

      <div className="glass p-1.5 flex gap-1">
        {[["7", "7 Days"], ["30", "30 Days"], ["all", "All Time"]].map(([k, l]) => (
          <Btn key={k} onClick={() => setRange(k)} className="flex-1 py-2 rounded-2xl text-sm font-bold text-white"
            style={{ background: range === k ? "linear-gradient(90deg,#7c3aed,#06b6d4)" : "transparent", boxShadow: range === k ? "0 0 16px rgba(34,211,238,.45)" : "none" }}>{l}</Btn>
        ))}
      </div>

      <section className="glass p-4">
        <div className="flex gap-2 mb-3">
          {SERIES.map((s) => (
            <Btn key={s.k} onClick={() => setOn({ ...on, [s.k]: !on[s.k] })} className="px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"
              style={{ background: on[s.k] ? s.color + "30" : "rgba(255,255,255,.08)", color: on[s.k] ? s.color : "rgba(255,255,255,.4)", border: "1px solid " + (on[s.k] ? s.color : "transparent") }}>
              <span className="w-2 h-2 rounded-full" style={{ background: s.color }} /> {s.label}
            </Btn>
          ))}
        </div>
        {data.length === 0 ? (
          <p className="text-center text-white/50 py-12 text-sm">No readings in this range.</p>
        ) : (
          <svg viewBox={"0 0 " + W + " " + H} className="w-full touch-none" onPointerMove={move} onPointerDown={move} onPointerLeave={() => {}}>
            <defs><filter id="g"><feGaussianBlur stdDeviation="2.5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs>
            {[0, 1, 2, 3, 4].map((i) => {
              const v = min + ((max - min) * i) / 4;
              return <g key={i}><line x1={L} x2={W - R} y1={Y(v)} y2={Y(v)} stroke="rgba(255,255,255,.1)" strokeDasharray="3 4" />
                <text x={L - 5} y={Y(v) + 3} textAnchor="end" fontSize="9" fill="rgba(255,255,255,.45)">{Math.round(v)}</text></g>;
            })}
            <text x={L} y={H - 6} fontSize="9" fill="rgba(255,255,255,.45)">{fmtShort(t0)}</text>
            <text x={W - R} y={H - 6} fontSize="9" textAnchor="end" fill="rgba(255,255,255,.45)">{fmtShort(t1)}</text>
            {active.map((s) => (
              <g key={s.k + range + data.length}>
                {data.length > 1 && <polyline className="draw" pathLength="1" fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" filter="url(#g)"
                  points={data.map((l) => X(l) + "," + Y(l[s.k])).join(" ")} />}
                {data.map((l, i) => <circle key={l.id} cx={X(l)} cy={Y(l[s.k])} r={sel === i ? 5 : 2.8} fill={s.color} stroke="#0f0a2a" strokeWidth="1" />)}
              </g>
            ))}
            {point && <line x1={X(point)} x2={X(point)} y1={T} y2={H - B} stroke="rgba(255,255,255,.4)" />}
          </svg>
        )}
        <div className="h-12 mt-1 text-center text-xs">
          {point ? (
            <div className="pop">
              <p className="text-white/60">{fmtDate(point.ts)} · {new Date(point.ts).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}</p>
              <p className="font-bold"><span style={{ color: "#ff7aa2" }}>SYS {point.sys}</span> · <span style={{ color: "#22d3ee" }}>DIA {point.dia}</span> · <span style={{ color: "#a3e635" }}>♥ {point.hr}</span></p>
            </div>
          ) : <p className="text-white/40 pt-2">Tap or drag on the chart to inspect a reading</p>}
        </div>
      </section>

      <div className="grid grid-cols-3 gap-2">
        {SERIES.map((s) => { const st = stat(s.k); return (
          <div key={s.k} className="glass p-3 text-center" style={{ borderRadius: 20 }}>
            <p className="text-[11px] font-black" style={{ color: s.color }}>{s.label}</p>
            <p className="text-[10px] text-white/40">AVG</p>
            <p className="text-2xl font-black">{st ? st.avg : "–"}</p>
            <div className="flex justify-around text-[11px] mt-1">
              <span className="text-rose-300">▲{st ? st.max : "–"}</span><span className="text-sky-300">▼{st ? st.min : "–"}</span>
            </div>
          </div>
        ); })}
      </div>

      <section className="glass p-4">
        <p className="text-sm font-black mb-3">🧠 Smart Insights</p>
        <ul className="space-y-2.5">
          {insights.map((i, n) => (
            <li key={n} className="slide-in flex gap-3 text-[13px] text-white/85 rounded-xl p-3" style={{ background: "rgba(0,0,0,.25)", animationDelay: n * 70 + "ms" }}>
              <span className="text-lg">{i.icon}</span><span>{i.text}</span>
            </li>
          ))}
        </ul>
      </section>
    </div>
  );
}

/* ============================ HISTORY ============================ */
function History({ logs, onDelete, onReset }) {
  const [confirm, setConfirm] = useState(null);
  const sorted = [...logs].sort((a, b) => b.ts - a.ts);
  useEffect(() => { if (!confirm) return; const t = setTimeout(() => setConfirm(null), 3000); return () => clearTimeout(t); }, [confirm]);
  return (
    <div className="space-y-4">
      <header className="pt-2 flex items-end justify-between">
        <h1 className="text-2xl font-extrabold">History & <span className="text-cyan-300">Export</span></h1>
        <span className="text-xs text-white/50">{sorted.length} entries</span>
      </header>
      <Btn onClick={() => exportCSV(logs)} disabled={!logs.length} className="w-full py-4 rounded-2xl text-base font-black text-white flex items-center justify-center gap-2"
        style={{ background: "linear-gradient(90deg,#059669,#06b6d4)", boxShadow: "0 8px 26px rgba(16,185,129,.4)", opacity: logs.length ? 1 : .5 }}>
        <Icon name="dl" /> Export to CSV
      </Btn>
      {sorted.length === 0 && <p className="text-center text-white/50 py-10">No entries yet.</p>}
      <ul className="space-y-2.5">
        {sorted.map((l, i) => {
          const c = classify(l.sys, l.dia), h = hrStatus(l.hr), d = new Date(l.ts);
          return (
            <li key={l.id} className="glass slide-in flex items-center gap-3 p-3.5" style={{ borderLeft: "6px solid " + c.color, borderRadius: 18, animationDelay: Math.min(i, 10) * 40 + "ms" }}>
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-2">
                  <span className="text-2xl font-black">{l.sys}/{l.dia}</span>
                  <span className="text-sm font-bold" style={{ color: h.color }}>♥ {l.hr}</span>
                </div>
                <p className="text-[11px] font-bold" style={{ color: c.color }}>{c.label}{l.tag ? <span className="text-white/50 font-normal"> · {l.tag}</span> : ""}</p>
                <p className="text-[11px] text-white/45">{fmtDate(l.ts)} · {pad(d.getHours())}:{pad(d.getMinutes())}</p>
              </div>
              <Btn onClick={() => (confirm === l.id ? (setConfirm(null), onDelete(l.id)) : setConfirm(l.id))} aria-label="Delete entry"
                className="rounded-xl px-3 py-2 text-xs font-bold flex items-center gap-1"
                style={{ background: confirm === l.id ? "#e11d48" : "rgba(255,255,255,.1)", color: confirm === l.id ? "#fff" : "#fda4af" }}>
                <Icon name="trash" className="w-4 h-4" />{confirm === l.id ? "Sure?" : ""}
              </Btn>
            </li>
          );
        })}
      </ul>
      <div className="text-center pt-2"><button onClick={onReset} className="text-[11px] text-white/35 underline">Reset to demo data</button></div>
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [state, setState] = useState(load);
  const [screen, setScreen] = useState("home");
  const [result, setResult] = useState(null);
  const [burst, setBurst] = useState(0);
  const [installEvt, setInstallEvt] = useState(null);

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, [state]);
  useEffect(() => {
    const h = (e) => { e.preventDefault(); setInstallEvt(e); };
    window.addEventListener("beforeinstallprompt", h);
    window.addEventListener("appinstalled", () => setInstallEvt(null));
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);
  useEffect(() => { window.scrollTo(0, 0); }, [screen]);

  const install = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; setInstallEvt(null); };

  const save = ({ sys, dia, hr, tag }) => {
    const ts = Date.now(); // exact moment of saving
    const entry = { id: "e" + ts + Math.random().toString(36).slice(2, 6), ts, sys, dia, hr, tag };
    const today = dayKey(ts);
    const firstToday = state.lastDay !== today;
    let streak = state.streak;
    if (firstToday) streak = state.lastDay === dayKey(ts - DAY) ? state.streak + 1 : 1;
    const gain = 20 + (tag ? 5 : 0) + (firstToday ? Math.min(streak * 2, 20) : 0);
    const next = { logs: [...state.logs, entry], exp: state.exp + gain, streak, lastDay: today };
    const before = earnedIds(state), after = earnedIds(next);
    setState(next);
    setResult({ entry, gain, cat: classify(sys, dia), level: levelOf(next.exp), levelUp: levelOf(next.exp) > levelOf(state.exp), newBadges: BADGES.filter((b) => after.includes(b.id) && !before.includes(b.id)) });
    setBurst((b) => b + 1);
  };

  const nav = [["home", "Home", "home"], ["record", "Record", "plus"], ["trends", "Trends", "chart"], ["history", "History", "list"]];

  return (
    <div className="max-w-md mx-auto px-4" style={{ paddingTop: "max(env(safe-area-inset-top), 12px)", paddingBottom: "calc(110px + env(safe-area-inset-bottom))" }}>
      <Confetti trigger={burst} />
      <main key={screen} className="page-enter">
        {screen === "home" && <Home state={state} go={setScreen} installEvt={installEvt} onInstall={install} />}
        {screen === "record" && <Record onSave={save} />}
        {screen === "trends" && <Trends logs={state.logs} />}
        {screen === "history" && <History logs={state.logs} onDelete={(id) => setState({ ...state, logs: state.logs.filter((l) => l.id !== id) })}
          onReset={() => { if (confirm("Replace all data with demo data?")) setState(seed()); }} />}
      </main>

      {result && <ResultModal result={result} onClose={() => { setResult(null); setScreen("home"); }} />}

      <nav className="fixed left-0 right-0 bottom-0 flex justify-center px-3" style={{ zIndex: 60, paddingBottom: "max(env(safe-area-inset-bottom), 10px)" }}>
        <div className="glass w-full max-w-md grid grid-cols-4 p-1.5" style={{ borderRadius: 28, background: "rgba(22,15,60,.82)" }}>
          {nav.map(([k, label, icon]) => {
            const act = screen === k, center = k === "record";
            return (
              <Btn key={k} onClick={() => setScreen(k)} className="flex flex-col items-center py-2 rounded-3xl"
                style={{ background: act ? "linear-gradient(145deg,rgba(124,58,237,.6),rgba(6,182,212,.45))" : "transparent", color: act ? "#fff" : "rgba(255,255,255,.5)", boxShadow: act ? "0 0 18px rgba(34,211,238,.4)" : "none" }}>
                <span style={{ transition: "transform .4s var(--spring)", transform: act ? "translateY(-2px) scale(1.15)" : "none" }}><Icon name={icon} className={center ? "w-7 h-7" : "w-6 h-6"} /></span>
                <span className="text-[10px] font-bold mt-0.5">{label}</span>
              </Btn>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.warn));
}
</script>
</body>
</html>
