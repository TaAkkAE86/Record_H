<!-- Apply saved theme/language before first paint (prevents flash) -->
<script>
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem("pulsequest-prefs") || "null") || {};
      var th = p.theme === "light" ? "light" : "dark";
      var lg = p.lang || ((navigator.language || "").toLowerCase().indexOf("th") === 0 ? "th" : "en");
      document.documentElement.setAttribute("data-theme", th);
      document.documentElement.setAttribute("lang", lg);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", th === "light" ? "#f3f0ff" : "#0f0a2a");
    } catch (e) {}
  })();
</script>

/* Current language/theme are module-level so plain helpers can use them.
   App sets them during render, then every child re-renders with the new values. */
const PREFS_KEY = "pulsequest-prefs";
function loadPrefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem(PREFS_KEY) || "null") || {}; } catch (e) {}
  const lang = p.lang === "th" || p.lang === "en" ? p.lang : ((navigator.language || "").toLowerCase().startsWith("th") ? "th" : "en");
  const theme = p.theme === "light" ? "light" : "dark";
  return { lang, theme };
}
let LANG = loadPrefs().lang;
let THEME = loadPrefs().theme;

const t = (k, v) => {
  const val = (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : (I18N.en[k] !== undefined ? I18N.en[k] : k);
  if (typeof val !== "string" || !v) return val;
  return val.replace(/\{(\w+)\}/g, (m, key) => (v[key] !== undefined ? v[key] : m));
};
const loc = () => (LANG === "th" ? "th-TH" : "en-US");

/* theme-aware status colours */
const PAL = {
  dark:  { sky: "#38bdf8", green: "#34d399", yellow: "#facc15", orange: "#fb923c", rose: "#f43f5e", red: "#ef4444", sys: "#ff7aa2", dia: "#22d3ee", hr: "#a3e635" },
  light: { sky: "#0284c7", green: "#059669", yellow: "#ca8a04", orange: "#ea580c", rose: "#e11d48", red: "#dc2626", sys: "#e11d63", dia: "#0891b2", hr: "#65a30d" },
};
const pal = (n) => PAL[THEME][n];

/* ============================ CONSTANTS & HELPERS ============================ */
const KEY = "pulsequest-v1";
const DAY = 864e5;
const pad = (n) => String(n).padStart(2, "0");
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const fmtDate = (ts) => new Date(ts).toLocaleDateString(loc(), { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtHM = (ts) => new Date(ts).toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" });
const fmtShort = (ts) => new Date(ts).toLocaleDateString(loc(), { month: "short", day: "numeric" });
const levelOf = (exp) => Math.floor(exp / 100) + 1;
const avg = (a) => a.reduce((s, x) => s + x, 0) / (a.length || 1);
const sd = (a) => { const m = avg(a); return Math.sqrt(avg(a.map((x) => (x - m) ** 2))); };

const PRESET_TAGS = ["Morning", "After Exercise", "Before Bed", "After Meal", "Stressed", "Resting"];
const tagLabel = (tag) => (PRESET_TAGS.includes(tag) ? t("tag." + tag) : tag);

const mkCat = (key, colorName, emoji) => ({
  key, emoji,
  get color() { return pal(colorName); },
  get label() { return t("cat." + key + ".label"); },
  get summary() { return t("cat." + key + ".summary"); },
  get tips() { return t("cat." + key + ".tips"); },
});
const CATS = {
  low: mkCat("low", "sky", "💧"),
  normal: mkCat("normal", "green", "💚"),
  elevated: mkCat("elevated", "yellow", "⚠️"),
  stage1: mkCat("stage1", "orange", "🟠"),
  stage2: mkCat("stage2", "rose", "🔴"),
  crisis: mkCat("crisis", "red", "🚨"),
};
function classify(s, d) {
  if (s > 180 || d > 120) return CATS.crisis;
  if (s >= 140 || d >= 90) return CATS.stage2;
  if (s >= 130 || d >= 80) return CATS.stage1;
  if (s < 90 || d < 60) return CATS.low;
  if (s >= 120) return CATS.elevated;
  return CATS.normal;
}
function hrStatus(h) {
  if (h < 60) return { label: t("hr.low"), color: pal("sky") };
  if (h <= 100) return { label: t("hr.normal"), color: pal("green") };
  return { label: t("hr.high"), color: pal("rose") };
}
// traffic-light colour for the main indicator (green / yellow / red)
const trafficColor = (c) => ({ normal: pal("green"), low: pal("sky"), elevated: pal("yellow"), stage1: pal("orange") }[c.key] || pal("rose"));

const mkBadge = (id, icon, test) => ({
  id, icon, test,
  get name() { return t("badge." + id + ".name"); },
  get desc() { return t("badge." + id + ".desc"); },
});
const BADGES = [
  mkBadge("first", "🩺", (s) => s.logs.length >= 1),
  mkBadge("s3", "🔥", (s) => s.streak >= 3),
  mkBadge("s7", "⚡", (s) => s.streak >= 7),
  mkBadge("l10", "📈", (s) => s.logs.length >= 10),
  mkBadge("g5", "💚", (s) => s.logs.filter((l) => classify(l.sys, l.dia).key === "normal").length >= 5),
  mkBadge("tag", "🏷️", (s) => new Set(s.logs.map((l) => l.tag).filter(Boolean)).size >= 3),
  mkBadge("lv3", "🏆", (s) => levelOf(s.exp) >= 3),
];
const earnedIds = (s) => BADGES.filter((b) => b.test(s)).map((b) => b.id);

function seed() {
  const now = new Date();
  const mk = (d, h, m, sys, dia, hr, tag, i) => {
    const ts = new Date(now.getFullYear(), now.getMonth(), now.getDate() - d, h, m).getTime();
    return { id: "seed" + i, ts, sys, dia, hr, tag };
  };
  const logs = [
    mk(6, 8, 10, 128, 82, 74, "Morning", 1),
    mk(5, 21, 30, 134, 86, 78, "Before Bed", 2),
    mk(4, 7, 45, 122, 78, 70, "Morning", 3),
    mk(3, 8, 20, 118, 76, 68, "Morning", 4),
    mk(2, 19, 0, 142, 91, 96, "After Exercise", 5),
    mk(1, 7, 50, 119, 77, 69, "Morning", 6),
    mk(1, 21, 15, 124, 80, 72, "Before Bed", 7),
  ];
  return { logs, exp: 175, streak: 6, lastDay: dayKey(Date.now() - DAY) };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.logs)) return s; } } catch (e) {}
  return seed();
}
function effStreak(s) {
  const td = dayKey(Date.now()), y = dayKey(Date.now() - DAY);
  return s.lastDay === td || s.lastDay === y ? s.streak : 0;
}

function buildCSV(logs) {
  const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [[t("csv.date"), t("csv.time"), t("csv.sys"), t("csv.dia"), t("csv.pulse"), t("csv.cat"), t("csv.tag")]];
  [...logs].sort((a, b) => b.ts - a.ts).forEach((l) => {
    const d = new Date(l.ts);
    rows.push([dayKey(l.ts), pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()), l.sys, l.dia, l.hr, classify(l.sys, l.dia).label, l.tag ? tagLabel(l.tag) : ""]);
  });
  return "\uFEFF" + rows.map((r) => r.map(q).join(",")).join("\r\n");
}
async function exportCSV(logs) {
  const name = "pulsequest-" + dayKey(Date.now()) + ".csv";
  const blob = new Blob([buildCSV(logs)], { type: "text/csv;charset=utf-8;" });
  try {
    const file = new File([blob], name, { type: "text/csv" });
    // iOS standalone apps cannot always download blobs, so use the share sheet there
    if (/iPad|iPhone|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: t("csv.share") });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function getInsights(logs) {
  const out = [];
  if (logs.length < 3) return [{ icon: "🧪", text: t("ins.need") }];
  const sys = logs.map((l) => l.sys), hr = logs.map((l) => l.hr);
  const s = sd(sys);
  out.push(s < 6 ? { icon: "🎯", text: t("ins.sys.stable", { n: s.toFixed(1) }) }
    : s < 12 ? { icon: "📊", text: t("ins.sys.mod", { n: s.toFixed(1) }) }
    : { icon: "🎢", text: t("ins.sys.wild", { n: s.toFixed(1) }) });
  const am = logs.filter((l) => new Date(l.ts).getHours() < 12), pm = logs.filter((l) => new Date(l.ts).getHours() >= 17);
  if (am.length && pm.length) {
    const diff = avg(pm.map((l) => l.sys)) - avg(am.map((l) => l.sys));
    if (Math.abs(diff) >= 5) out.push({ icon: diff > 0 ? "🌙" : "🌅", text: t(diff > 0 ? "ins.eve" : "ins.morn", { n: Math.abs(diff).toFixed(0) }) });
    else out.push({ icon: "⏱️", text: t("ins.nodiff") });
  }
  const hs = sd(hr), ha = avg(hr);
  out.push({ icon: "💓", text: t("ins.hr", { avg: ha.toFixed(0), sd: hs.toFixed(1), desc: t(hs < 6 ? "ins.hr.vs" : hs < 12 ? "ins.hr.fs" : "ins.hr.qv") }) + (ha > 100 ? t("ins.hr.above") : ha < 60 ? t("ins.hr.below") : "") });
  const spike = logs.filter((l) => l.hr > 100 || l.sys >= 140);
  if (spike.length) {
    const last = spike[spike.length - 1];
    out.push({ icon: "📍", text: t("ins.spike", { n: spike.length, date: fmtShort(last.ts), tag: last.tag ? " (" + tagLabel(last.tag) + ")" : "" }) });
  }
  if (logs.length >= 4) {
    const h = Math.floor(logs.length / 2);
    const d = avg(sys.slice(h)) - avg(sys.slice(0, h));
    if (Math.abs(d) >= 4) out.push({ icon: d < 0 ? "📉" : "📈", text: t(d < 0 ? "ins.down" : "ins.up", { n: Math.abs(d).toFixed(0) }) });
  }
  const pct = Math.round(logs.filter((l) => classify(l.sys, l.dia).key === "normal").length / logs.length * 100);
  out.push({ icon: pct >= 60 ? "✅" : "🩹", text: t("ins.pct", { n: pct }) });
  return out;
}

/* ============================ UI PRIMITIVES ============================ */
function Btn({ children, className = "", onClick, style, type = "button", disabled, ...rest }) {
  const [ripples, setRipples] = useState([]);
  const down = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    setRipples((p) => [...p, { id: Math.random(), x: e.clientX - r.left - size / 2, y: e.clientY - r.top - size / 2, size }]);
    if (navigator.vibrate) navigator.vibrate(8);
  };
  return (
    <button type={type} disabled={disabled} onPointerDown={down} onClick={onClick} style={style} className={"btn " + className} {...rest}>
      {children}
      {ripples.map((r) => (
        <span key={r.id} className="ripple" style={{ left: r.x, top: r.y, width: r.size, height: r.size }}
          onAnimationEnd={() => setRipples((p) => p.filter((x) => x.id !== r.id))} />
      ))}
    </button>
  );
}

function Confetti({ trigger }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!trigger) return;
    const c = ref.current; const ctx = c.getContext("2d");
    c.width = innerWidth; c.height = innerHeight;
    const colors = ["#22d3ee", "#a855f7", "#f472b6", "#facc15", "#34d399", "#fff"];
    const ps = Array.from({ length: 140 }, () => {
      const a = Math.random() * Math.PI * 2, v = 6 + Math.random() * 12;
      return { x: c.width / 2, y: c.height * 0.55, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 7, g: .3 + Math.random() * .2,
        s: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: colors[(Math.random() * colors.length) | 0], star: Math.random() > .6 };
    });
    let f = 0, raf;
    const tick = () => {
      ctx.clearRect(0, 0, c.width, c.height); f++;
      ps.forEach((p) => {
        p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.globalAlpha = Math.max(0, 1 - f / 110); ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 12;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        if (p.star) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      });
      if (f < 110) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
    };
    tick();
    return () => cancelAnimationFrame(raf);
  }, [trigger]);
  return <canvas ref={ref} className="fixed inset-0 pointer-events-none" style={{ zIndex: 80 }} />;
}

/* ============================ RECORD ============================ */
function Record({ onSave }) {
  const [sys, setSys] = useState(""); const [dia, setDia] = useState(""); const [hr, setHr] = useState("");
  const [tag, setTag] = useState(""); const [err, setErr] = useState(""); // err holds a translation key
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const tm = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(tm); }, []);
  const clean = (fn) => (e) => { fn(e.target.value.replace(/\D/g, "").slice(0, 3)); setErr(""); };

  const submit = (e) => {
    e.preventDefault();
    const s = +sys, d = +dia, h = +hr;
    if (!sys || !dia || !hr) return setErr("err.fill");
    if (s < 50 || s > 260) return setErr("err.sys");
    if (d < 30 || d > 160) return setErr("err.dia");
    if (h < 30 || h > 220) return setErr("err.hr");
    if (d >= s) return setErr("err.order");
    onSave({ sys: s, dia: d, hr: h, tag: tag.trim() });
    setSys(""); setDia(""); setHr(""); setTag("");
  };

  const num = ({ label, unit, value, set, color, ph, id }) => (
    <label htmlFor={id} className="block">
      <div className="flex justify-between text-xs font-bold mb-1.5"><span style={{ color }}>{label}</span><span className="text-white/40">{unit}</span></div>
      <input id={id} className="field text-center text-4xl font-black py-4" type="text" inputMode="numeric" pattern="[0-9]*" enterKeyHint="next"
        autoComplete="off" placeholder={ph} value={value} onChange={clean(set)} />
    </label>
  );

  return (
    <form onSubmit={submit} className="space-y-4">
      <header className="pt-2">
        <h1 className="text-2xl font-extrabold">{t("rec.title1")} <span className="text-cyan-300">{t("rec.title2")}</span></h1>
        <p className="text-xs text-white/50 mt-1">🕒 {fmtDate(now)} · {fmtTime(now)}</p>
      </header>
      <section className="glass p-5 space-y-4">
        {num({ id: "sys", label: t("rec.sys"), unit: "mmHg", value: sys, set: setSys, color: pal("sys"), ph: "120" })}
        {num({ id: "dia", label: t("rec.dia"), unit: "mmHg", value: dia, set: setDia, color: pal("dia"), ph: "80" })}
        {num({ id: "hr", label: t("rec.hr"), unit: t("home.bpm"), value: hr, set: setHr, color: pal("hr"), ph: "72" })}
      </section>
      <section className="glass p-5">
        <p className="text-xs font-bold text-white/60 mb-2">{t("rec.tag")} <span className="text-white/30">{t("rec.tagOpt")}</span></p>
        <div className="flex flex-wrap gap-2 mb-3">
          {PRESET_TAGS.map((tg) => (
            <Btn key={tg} onClick={() => setTag(tag === tg ? "" : tg)} className="px-3 py-1.5 rounded-full text-xs font-bold"
              style={{ background: tag === tg ? GRAD : "var(--chip)", color: tag === tg ? "#fff" : "var(--text)" }}>{t("tag." + tg)}</Btn>
          ))}
        </div>
        <input className="field px-4 py-3 text-sm" placeholder={t("rec.custom")} maxLength={40} value={tagLabel(tag)} onChange={(e) => setTag(e.target.value)} />
      </section>
      {err && <p className="pop text-sm text-rose-300 text-center font-semibold" role="alert">{t(err)}</p>}
      <Btn type="submit" className="w-full py-4 rounded-2xl text-lg font-black text-white" style={{ background: "linear-gradient(90deg,#7c3aed,#06b6d4,#10b981)", boxShadow: "0 8px 28px rgba(6,182,212,.45)", color: "#fff" }}>
        💾 {t("rec.save")}
      </Btn>
      <p className="text-[11px] text-center text-white/40">{t("rec.auto")}</p>
    </form>
  );
}

/* ============================ TRENDS ============================ */
const SERIES_KEYS = ["sys", "dia", "hr"];
function Trends({ logs }) {
  const [range, setRange] = useState("7");
  const [on, setOn] = useState({ sys: true, dia: true, hr: true });
  const [sel, setSel] = useState(null);

  const SERIES = [
    { k: "sys", label: "SYS", color: pal("sys") },
    { k: "dia", label: "DIA", color: pal("dia") },
    { k: "hr", label: t("tr.pulse"), color: pal("hr") },
  ];

  const data = useMemo(() => {
    const sorted = [...logs].sort((a, b) => a.ts - b.ts);
    if (range === "all") return sorted;
    const cut = Date.now() - +range * DAY;
    return sorted.filter((l) => l.ts >= cut);
  }, [logs, range]);
  useEffect(() => setSel(null), [range]);

  const W = 340, H = 200, L = 30, R = 10, T = 12, B = 24;
  const active = SERIES.filter((s) => on[s.k]);
  const vals = data.flatMap((l) => active.map((s) => l[s.k]));
  const min = vals.length ? Math.floor((Math.min(...vals) - 8) / 10) * 10 : 0;
  const max = vals.length ? Math.ceil((Math.max(...vals) + 8) / 10) * 10 : 100;
  const t0 = data.length ? data[0].ts : 0, t1 = data.length ? data[data.length - 1].ts : 1;
  const X = (l) => L + (data.length < 2 || t1 === t0 ? (W - L - R) / 2 : ((l.ts - t0) / (t1 - t0)) * (W - L - R));
  const Y = (v) => T + (1 - (v - min) / (max - min || 1)) * (H - T - B);

  const move = (e) => {
    if (!data.length) return;
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    let best = 0, bd = 1e9;
    data.forEach((l, i) => { const d = Math.abs(X(l) - x); if (d < bd) { bd = d; best = i; } });
    setSel(best);
  };
  const point = sel != null ? data[sel] : null;

  const stat = (k) => { const a = data.map((l) => l[k]); return a.length ? { avg: Math.round(avg(a)), max: Math.max(...a), min: Math.min(...a) } : null; };
  // recompute when data, language or theme changes
  const insights = useMemo(() => getInsights(data), [data, LANG]);

  return (
    <div className="space-y-4">
      <header className="pt-2"><h1 className="text-2xl font-extrabold">{t("tr.title1")} <span className="text-cyan-300">{t("tr.title2")}</span></h1></header>

      <div className="glass p-1.5 flex gap-1">
        {["7", "30", "all"].map((k) => (
          <Btn key={k} onClick={() => setRange(k)} className="flex-1 py-2 rounded-2xl text-sm font-bold"
            style={{ background: range === k ? GRAD : "transparent", color: range === k ? "#fff" : "var(--text)", boxShadow: range === k ? "0 0 16px rgba(34,211,238,.45)" : "none" }}>{t("tr." + k)}</Btn>
        ))}
      </div>

      <section className="glass p-4">
        <div className="flex gap-2 mb-3">
          {SERIES.map((s) => (
            <Btn key={s.k} onClick={() => setOn({ ...on, [s.k]: !on[s.k] })} className="px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"
              style={{ background: on[s.k] ? s.color + "30" : "var(--chip-soft)", color: on[s.k] ? s.color : "var(--t40)", border: "1px solid " + (on[s.k] ? s.color : "transparent") }}>
              <span className="w-2 h-2 rounded-full" style={{ background: s.color }} /> {s.label}
            </Btn>
          ))}
        </div>
        {data.length === 0 ? (
          <p className="text-center text-white/50 py-12 text-sm">{t("tr.empty")}</p>
        ) : (
          <svg viewBox={"0 0 " + W + " " + H} className="w-full touch-none" onPointerMove={move} onPointerDown={move} onPointerLeave={() => {}}>
            <defs><filter id="g"><feGaussianBlur stdDeviation="2.5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs>
            {[0, 1, 2, 3, 4].map((i) => {
              const v = min + ((max - min) * i) / 4;
              return <g key={i}><line x1={L} x2={W - R} y1={Y(v)} y2={Y(v)} strokeDasharray="3 4" style={{ stroke: "var(--grid)" }} />
                <text x={L - 5} y={Y(v) + 3} textAnchor="end" fontSize="9" style={{ fill: "var(--t45)" }}>{Math.round(v)}</text></g>;
            })}
            <text x={L} y={H - 6} fontSize="9" style={{ fill: "var(--t45)" }}>{fmtShort(t0)}</text>
            <text x={W - R} y={H - 6} fontSize="9" textAnchor="end" style={{ fill: "var(--t45)" }}>{fmtShort(t1)}</text>
            {active.map((s) => (
              <g key={s.k + range + data.length + THEME}>
                {data.length > 1 && <polyline className="draw" pathLength="1" fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" filter={THEME === "dark" ? "url(#g)" : undefined}
                  points={data.map((l) => X(l) + "," + Y(l[s.k])).join(" ")} />}
                {data.map((l, i) => <circle key={l.id} cx={X(l)} cy={Y(l[s.k])} r={sel === i ? 5 : 2.8} fill={s.color} strokeWidth="1" style={{ stroke: "var(--bg-solid)" }} />)}
              </g>
            ))}
            {point && <line x1={X(point)} x2={X(point)} y1={T} y2={H - B} style={{ stroke: "var(--t40)" }} />}
          </svg>
        )}
        <div className="h-12 mt-1 text-center text-xs">
          {point ? (
            <div className="pop">
              <p className="text-white/60">{fmtDate(point.ts)} · {fmtHM(point.ts)}</p>
              <p className="font-bold"><span style={{ color: pal("sys") }}>SYS {point.sys}</span> · <span style={{ color: pal("dia") }}>DIA {point.dia}</span> · <span style={{ color: pal("hr") }}>♥ {point.hr}</span></p>
            </div>
          ) : <p className="text-white/40 pt-2">{t("tr.hint")}</p>}
        </div>
      </section>

      <div className="grid grid-cols-3 gap-2">
        {SERIES.map((s) => { const st = stat(s.k); return (
          <div key={s.k} className="glass p-3 text-center" style={{ borderRadius: 20 }}>
            <p className="text-[11px] font-black" style={{ color: s.color }}>{s.label}</p>
            <p className="text-[10px] text-white/40">{t("tr.avg")}</p>
            <p className="text-2xl font-black">{st ? st.avg : "–"}</p>
            <div className="flex justify-around text-[11px] mt-1">
              <span className="text-rose-300">▲{st ? st.max : "–"}</span><span className="text-sky-300">▼{st ? st.min : "–"}</span>
            </div>
          </div>
        ); })}
      </div>

      <section className="glass p-4">
        <p className="text-sm font-black mb-3">{t("tr.insights")}</p>
        <ul className="space-y-2.5">
          {insights.map((i, n) => (
            <li key={n} className="slide-in flex gap-3 text-[13px] text-white/85 rounded-xl p-3" style={{ background: "var(--inset)", animationDelay: n * 70 + "ms" }}>
              <span className="text-lg">{i.icon}</span><span>{i.text}</span>
            </li>
          ))}
        </ul>
      </section>
    </div>
  );
}

        <Icon name="dl" /> {t("hi.export")}
      </Btn>
      {sorted.length === 0 && <p className="text-center text-white/50 py-10">{t("hi.none")}</p>}
      <ul className="space-y-2.5">
        {sorted.map((l, i) => {
          const c = classify(l.sys, l.dia), h = hrStatus(l.hr), d = new Date(l.ts);
          const asking = confirmId === l.id;
          return (
            <li key={l.id} className="glass slide-in flex items-center gap-3 p-3.5" style={{ borderLeft: "6px solid " + c.color, borderRadius: 18, animationDelay: Math.min(i, 10) * 40 + "ms" }}>
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline gap-2">
                  <span className="text-2xl font-black">{l.sys}/{l.dia}</span>
                  <span className="text-sm font-bold" style={{ color: h.color }}>♥ {l.hr}</span>
                </div>
                <p className="text-[11px] font-bold" style={{ color: c.color }}>{c.label}{l.tag ? <span className="text-white/50 font-normal"> · {tagLabel(l.tag)}</span> : ""}</p>
                <p className="text-[11px] text-white/45">{fmtDate(l.ts)} · {pad(d.getHours())}:{pad(d.getMinutes())}</p>
              </div>
              <Btn onClick={() => (asking ? (setConfirmId(null), onDelete(l.id)) : setConfirmId(l.id))} aria-label={t("hi.del")}
                className="rounded-xl px-3 py-2 text-xs font-bold flex items-center gap-1"
                style={{ background: asking ? "#e11d48" : "var(--chip)", color: asking ? "#fff" : "var(--rose)" }}>
                <Icon name="trash" className="w-4 h-4" />{asking ? t("hi.sure") : ""}
              </Btn>
            </li>
          );
        })}
      </ul>
      <div className="text-center pt-2"><button onClick={onReset} className="text-[11px] text-white/35 underline" style={{ background: "none", border: 0, color: "var(--t35)", fontFamily: "inherit" }}>{t("hi.reset")}</button></div>
    </div>
  );
}

/* ============================ APP ============================ */
function App() {
  const [state, setState] = useState(load);
  const [prefs, setPrefs] = useState(loadPrefs);
  const [screen, setScreen] = useState("home");
  const [result, setResult] = useState(null);
  const [burst, setBurst] = useState(0);
  const [installEvt, setInstallEvt] = useState(null);

  // Apply prefs to the module-level values BEFORE children render
  LANG = prefs.lang; THEME = prefs.theme;
  const setLang = (lang) => setPrefs((p) => ({ ...p, lang }));
  const setTheme = (theme) => setPrefs((p) => ({ ...p, theme }));

  useEffect(() => {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
    const root = document.documentElement;
    root.setAttribute("data-theme", prefs.theme);
    root.setAttribute("lang", prefs.lang);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", prefs.theme === "light" ? "#f3f0ff" : "#0f0a2a");
  }, [prefs]);

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, [state]);
  useEffect(() => {
    const h = (e) => { e.preventDefault(); setInstallEvt(e); };
    window.addEventListener("beforeinstallprompt", h);
    window.addEventListener("appinstalled", () => setInstallEvt(null));
    return () => window.removeEventListener("beforeinstallprompt", h);
  }, []);
  useEffect(() => { window.scrollTo(0, 0); }, [screen]);

  const install = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; setInstallEvt(null); };

  const save = ({ sys, dia, hr, tag }) => {
    const ts = Date.now(); // exact moment of saving
    const entry = { id: "e" + ts + Math.random().toString(36).slice(2, 6), ts, sys, dia, hr, tag };
    const today = dayKey(ts);
    const firstToday = state.lastDay !== today;
    let streak = state.streak;
    if (firstToday) streak = state.lastDay === dayKey(ts - DAY) ? state.streak + 1 : 1;
    const gain = 20 + (tag ? 5 : 0) + (firstToday ? Math.min(streak * 2, 20) : 0);
    const next = { logs: [...state.logs, entry], exp: state.exp + gain, streak, lastDay: today };
    const before = earnedIds(state), after = earnedIds(next);
    setState(next);
    // keep badge ids (not objects) so names are translated at render time
    setResult({ entry, gain, catKey: classify(sys, dia).key, level: levelOf(next.exp), levelUp: levelOf(next.exp) > levelOf(state.exp), newBadgeIds: after.filter((id) => !before.includes(id)) });
    setBurst((b) => b + 1);
  };

  const nav = [["home", "nav.home", "home"], ["record", "nav.record", "plus"], ["trends", "nav.trends", "chart"], ["history", "nav.history", "list"]];
  const modalResult = result && { ...result, cat: CATS[result.catKey], newBadges: BADGES.filter((b) => result.newBadgeIds.includes(b.id)) };

  return (
    <div className="max-w-md mx-auto px-4" style={{ paddingTop: "max(env(safe-area-inset-top), 12px)", paddingBottom: "calc(110px + env(safe-area-inset-bottom))" }}>
      <Confetti trigger={burst} />
      <Controls lang={prefs.lang} setLang={setLang} theme={prefs.theme} setTheme={setTheme} />
      <main key={screen} className="page-enter">
        {screen === "home" && <Home state={state} go={setScreen} installEvt={installEvt} onInstall={install} />}
        {screen === "record" && <Record onSave={save} />}
        {screen === "trends" && <Trends logs={state.logs} />}
        {screen === "history" && <History logs={state.logs} onDelete={(id) => setState({ ...state, logs: state.logs.filter((l) => l.id !== id) })}
          onReset={() => { if (window.confirm(t("hi.confirmReset"))) setState(seed()); }} />}
      </main>

      {modalResult && <ResultModal result={modalResult} onClose={() => { setResult(null); setScreen("home"); }} />}

      <nav className="fixed left-0 right-0 bottom-0 flex justify-center px-3" style={{ zIndex: 60, paddingBottom: "max(env(safe-area-inset-bottom), 10px)" }}>
        <div className="glass w-full max-w-md grid grid-cols-4 p-1.5" style={{ borderRadius: 28, background: "var(--nav-bg)" }}>
          {nav.map(([k, labelKey, icon]) => {
            const act = screen === k, center = k === "record";
            return (
              <Btn key={k} onClick={() => setScreen(k)} className="flex flex-col items-center py-2 rounded-3xl"
                style={{ background: act ? "linear-gradient(145deg,rgba(124,58,237,.85),rgba(6,182,212,.7))" : "transparent", color: act ? "#fff" : "var(--t50)", boxShadow: act ? "0 0 18px rgba(34,211,238,.4)" : "none" }}>
                <span style={{ transition: "transform .4s var(--spring)", transform: act ? "translateY(-2px) scale(1.15)" : "none" }}><Icon name={icon} className={center ? "w-7 h-7" : "w-6 h-6"} /></span>
                <span className="text-[10px] font-bold mt-0.5">{t(labelKey)}</span>
              </Btn>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.warn));
}
</script>
</body>
</html>
